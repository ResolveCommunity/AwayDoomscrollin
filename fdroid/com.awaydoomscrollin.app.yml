AntiFeatures:
  Tracking:
    en-US: Telemetry is disabled by default and no telemetry is sent until the user
      explicitly opts in. While enabled, the app sends a random per-installation UUID,
      device manufacturer/model, Android/SDK/app version, aggregate platform and total
      block counts, streak days, and XP to awaydoomscrollin.com immediately after
      opt-in, at startup (subject to a 24-hour throttle), and after blocking events.
      Opting out stops future submissions; the latest server snapshot expires within
      90 days.
  NonFreeNet:
    en-US: The app automatically contacts GitHub when the app or accessibility service
      starts to fetch rule/configuration data. Successful fetches are cached for six
      hours. This request runs even while telemetry is disabled. Turning telemetry
      off does not disable GitHub requests, and there is currently no separate opt-out.
