AntiFeatures:
  Tracking:
    en-US: Anonymous telemetry is enabled by default (opt-out). While enabled,
      the app sends device manufacturer/model, Android/SDK/app version, aggregate
      platform and total block counts, streak days, and XP to awaydoomscrollin.com
      at startup (subject to a 24-hour throttle) and after blocking events.
  NonFreeNet:
    en-US: The app automatically contacts GitHub when the app or accessibility
      service starts to fetch rule/configuration data. Successful fetches are
      cached for six hours. This request is independent of the telemetry switch
      and currently has no separate opt-out.
