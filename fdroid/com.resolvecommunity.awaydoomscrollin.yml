AntiFeatures:
  Tracking:
    en-US: Telemetry is disabled by default and no telemetry is sent until the user
      explicitly opts in. While enabled, the app sends the constant PSEUDONYMOUS_TELEMETRY
      type marker, v2 report identifiers, a random per-installation UUID, device and screen
      information, AwayDoomscrollin'/Instagram/TikTok/YouTube versions, aggregate intervention
      counts, and Instagram curtain time to awaydoomscrollin.com. Local streak and XP data are not sent.
      Explicit opt-in may trigger one immediate attempt; afterward automatic app-startup
      and blocking-event triggers share one persisted 24-hour attempt interval, including
      failed attempts. Opting out stops future submissions; an in-flight request may
      finish, and the latest server snapshot expires within 90 days.
  NonFreeNet:
    en-US: If the user explicitly opts into telemetry, the app contacts the
      awaydoomscrollin.com service to submit the disclosed pseudonymous aggregate
      snapshot. Core detection does not depend on that service, telemetry is off by
      default, and no automatic rule-download request is made.
